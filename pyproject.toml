[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathoqc"
version = "0.1.0"
description = "Zayıf denetimli histopatoloji doku segmentasyonu (LUAD-HistoSeg, BCSS-WSSS)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "torchvision>=0.18",
    "numpy>=1.26",
    "pillow>=10",
]

[project.optional-dependencies]
# Patoloji omurgalarını (Hugging Face) indirmek ve çalıştırmak için.
fm = ["transformers>=4.44"]
dev = ["pytest>=8", "transformers>=4.44"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
